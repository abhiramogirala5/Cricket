[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gully-umpire-backend"
version = "1.0.0"
description = "Gully Umpire API: authentication, offline-first sync and match storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54,<1",
    "SQLAlchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "email-validator>=2.3,<3",
    "argon2-cffi>=25.1,<26",
    "PyJWT>=2.15,<3",
    "sentry-sdk>=2.71,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "aiosqlite>=0.22,<1",
    "ruff>=0.16,<1",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs sync code inside greenlets; without this, coverage under-reports.
concurrency = ["greenlet", "thread"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF", "PT", "PIE", "T20", "TID", "PL"]
ignore = [
    "PLR0913",  # many arguments are normal for service functions
    "PLR2004",  # magic numbers in validation helpers are readable here
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "B008",     # FastAPI Depends() in defaults
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311", "PT011", "E501"]
"alembic/**" = ["E501", "N999", "PLR0915"]
"app/models/**" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ (the migration folder) is not the alembic package.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sentry_sdk.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
