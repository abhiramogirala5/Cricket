# Local stack: PostgreSQL 16 + the API.
#   cp .env.example .env                 # root file: only the database password lives here
#   cp backend/.env.example backend/.env # then set JWT_SECRET_KEY
#   docker compose up --build
# The API is on http://localhost:8000 (docs at /docs unless APP_ENV=production).

name: gully-umpire

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gully_umpire
      POSTGRES_USER: gully
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only: reachable from your machine, not from the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gully -d gully_umpire"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever backend/.env says: inside compose the database host is "db".
      DATABASE_URL: postgresql+asyncpg://gully:${POSTGRES_PASSWORD}@db:5432/gully_umpire
    ports:
      - "8000:8000"

volumes:
  pgdata:
