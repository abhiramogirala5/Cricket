name: gully_umpire
description: Offline-first cricket scoring and AI umpiring assistant for gully cricket.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management, routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking and storage
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0

  # Umpire camera. Ranges (not single versions) so that pub picks the newest release that suits the
  # installed Flutter version.
  camera: ">=0.11.2 <0.13.0"
  google_mlkit_pose_detection: ">=0.13.0 <0.17.0"
  wakelock_plus: ">=1.2.0 <2.0.0"

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    # Local, git-ignored configuration (copy from .env.example). Contains NON-secret values only,
    # because anything bundled into a mobile app can be extracted.
    - .env
